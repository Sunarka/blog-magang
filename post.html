<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail Logbook Magang</title>
  
  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230d6efd'/><path d='M9 13.5L16 9l7 4.5-7 4.5-7-4.5z M10 16.5v3.5c0 1.5 2.7 3 6 3s6-1.5 6-3v-3.5l-6 3.5-6-3.5z' fill='white'/></svg>">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              blue: '#0d6efd',
              darkblue: '#0b5ed7',
              jumbotron: '#eaf2ff',
            }
          }
        }
      }
    }
  </script>

  <!-- Google Fonts & Custom CSS -->
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col selection:bg-brand-blue selection:text-white relative">

  <!-- TOP SCROLL PROGRESS BAR -->
  <div id="scroll-progress"></div>

  <!-- TOP NAVBAR -->
  <nav class="bg-brand-blue text-white sticky top-0 z-40 shadow-md">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      
      <a href="index.html" class="flex items-center gap-2 text-xs sm:text-sm font-bold text-white hover:text-blue-100 transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        <span>Kembali ke Beranda</span>
      </a>

      <div class="flex items-center gap-2">
        <button 
          onclick="copyUrl()" 
          title="Salin Link Artikel"
          class="px-3 py-1.5 rounded-lg bg-white/15 hover:bg-white/25 border border-white/25 text-xs font-semibold flex items-center gap-1.5 transition-all">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
          <span>Salin Link</span>
        </button>

        <button 
          id="theme-btn" 
          aria-label="Ganti Tema"
          class="p-2 rounded-lg bg-white/15 hover:bg-white/25 border border-white/25 text-xs transition-all flex items-center justify-center">
          <svg class="w-3.5 h-3.5 dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
          <svg class="w-3.5 h-3.5 hidden dark:block text-amber-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
        </button>
      </div>

    </div>
  </nav>

  <!-- MAIN ARTICLE CONTAINER -->
  <main class="flex-1 max-w-4xl w-full mx-auto px-4 sm:px-6 py-8 sm:py-12">
    
    <article class="bg-white dark:bg-slate-800/90 border border-slate-200 dark:border-slate-700 rounded-3xl p-6 sm:p-10 shadow-md">
      <div id="article-content">
        <!-- Injected via JavaScript -->
        <div class="py-12 text-center text-slate-400 font-mono text-xs">
          Memuat artikel...
        </div>
      </div>
    </article>

    <!-- POST NAVIGATION -->
    <nav id="post-nav" class="mt-8 grid grid-cols-1 sm:grid-cols-2 gap-4">
      <!-- Injected via JavaScript -->
    </nav>

  </main>

  <!-- FOOTER -->
  <footer class="bg-brand-blue text-white py-6 text-center text-xs mt-12 shadow-inner">
    <div class="max-w-4xl mx-auto px-4">
      <p>© 2026 I Komang Sunarka • S1 Ilmu Komputer Undiksha</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="assets/js/posts-data.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const postId = params.get('id') || (BLOG_DATA.posts[0] && BLOG_DATA.posts[0].id);

      const postIndex = BLOG_DATA.posts.findIndex(p => p.id === postId);
      const post = postIndex !== -1 ? BLOG_DATA.posts[postIndex] : BLOG_DATA.posts[0];

      if (!post) {
        document.getElementById('article-content').innerHTML = `
          <div class="text-center py-12">
            <h2 class="text-lg font-bold text-slate-900 dark:text-white">Artikel tidak ditemukan</h2>
            <a href="index.html" class="mt-3 inline-block text-xs font-bold text-brand-blue hover:underline">← Kembali ke Beranda</a>
          </div>
        `;
        return;
      }

      document.title = `${post.title} — Logbook Magang`;

      document.getElementById('article-content').innerHTML = `
        <!-- Meta Tags & Category Header -->
        <div class="flex flex-wrap items-center gap-2 mb-4">
          <span class="px-3 py-1 rounded-full bg-brand-blue text-white text-xs font-bold shadow-sm">
            Minggu ${post.week}
          </span>
          <span class="px-3 py-1 rounded-full bg-blue-50 dark:bg-blue-950 text-brand-blue dark:text-blue-300 text-xs font-semibold border border-blue-200 dark:border-blue-800">
            ${post.category}
          </span>
          <span class="text-xs text-slate-400">•</span>
          <span class="text-xs text-slate-500 dark:text-slate-400 font-medium">
            ${post.date}
          </span>
        </div>

        <!-- Title -->
        <h1 class="text-2xl sm:text-4xl font-extrabold text-slate-900 dark:text-white tracking-tight leading-tight mb-4">
          ${post.title}
        </h1>

        <!-- Author Banner Row -->
        <div class="flex items-center gap-3.5 pb-6 mb-6 border-b border-slate-100 dark:border-slate-700">
          <img src="${BLOG_DATA.author.avatar}" alt="${BLOG_DATA.author.name}" class="w-11 h-11 rounded-full object-cover object-top ring-2 ring-blue-500/20">
          <div>
            <div class="font-bold text-sm text-slate-900 dark:text-white">${BLOG_DATA.author.name}</div>
            <div class="text-xs text-slate-500 dark:text-slate-400">NIM: ${BLOG_DATA.author.nim} • S1 Ilmu Komputer Undiksha • Magang di ${BLOG_DATA.author.company}</div>
          </div>
        </div>

        <!-- Clean Visual Header (No Dummy Photo) -->
        <div class="rounded-2xl p-6 sm:p-8 bg-gradient-to-br ${getIconBgClass(post.iconType || 'testing')} text-white flex items-center justify-center mb-8 shadow-sm">
          <div class="w-16 h-16 rounded-2xl bg-white/20 backdrop-blur border border-white/30 flex items-center justify-center shadow-lg">
            ${getActivityIconSvg(post.iconType || 'testing', 'w-10 h-10')}
          </div>
        </div>

        <!-- Summary Highlight -->
        <div class="p-4 sm:p-5 rounded-2xl bg-blue-50 dark:bg-blue-950/40 border-l-4 border-brand-blue mb-8">
          <p class="text-sm sm:text-base font-medium text-slate-700 dark:text-slate-200 leading-relaxed italic">
            "${post.summary}"
          </p>
        </div>

        <!-- Body Content -->
        <div class="post-body">
          ${post.content}
        </div>

        <!-- Tags Row -->
        <div class="mt-10 pt-6 border-t border-slate-100 dark:border-slate-700 flex flex-wrap items-center justify-between gap-3">
          <div class="flex flex-wrap gap-1.5">
            ${post.tags.map(t => `<a href="index.html#logbook" class="text-xs font-semibold px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-300 hover:bg-brand-blue hover:text-white transition-colors">#${t}</a>`).join('')}
          </div>
          <button onclick="copyUrl()" class="text-xs font-bold text-brand-blue dark:text-blue-400 hover:underline flex items-center gap-1">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
            <span>Salin Link Artikel</span>
          </button>
        </div>
      `;

      // Previous and Next navigation
      const prev = postIndex > 0 ? BLOG_DATA.posts[postIndex - 1] : null;
      const next = postIndex < BLOG_DATA.posts.length - 1 ? BLOG_DATA.posts[postIndex + 1] : null;

      document.getElementById('post-nav').innerHTML = `
        ${prev ? `
          <a href="post.html?id=${prev.id}" class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 p-4 rounded-2xl hover:border-brand-blue transition-colors shadow-sm group">
            <span class="text-[11px] font-bold text-slate-400 block mb-0.5">← Catatan Sebelumnya</span>
            <span class="text-xs font-bold text-slate-800 dark:text-white group-hover:text-brand-blue line-clamp-1">${prev.title}</span>
          </a>
        ` : '<div></div>'}

        ${next ? `
          <a href="post.html?id=${next.id}" class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 p-4 rounded-2xl hover:border-brand-blue transition-colors shadow-sm group text-right">
            <span class="text-[11px] font-bold text-slate-400 block mb-0.5">Catatan Selanjutnya →</span>
            <span class="text-xs font-bold text-slate-800 dark:text-white group-hover:text-brand-blue line-clamp-1">${next.title}</span>
          </a>
        ` : '<div></div>'}
      `;
    });
  </script>

  <!-- FLOATING BACK-TO-TOP BUTTON WITH CIRCULAR PROGRESS RING -->
  <button 
    id="back-to-top" 
    aria-label="Kembali ke Atas"
    class="fixed bottom-6 right-6 z-40 w-11 h-11 rounded-full bg-white dark:bg-slate-800 text-brand-blue dark:text-blue-400 shadow-lg border border-slate-200 dark:border-slate-700 flex items-center justify-center hidden-btn hover:scale-110 active:scale-95 transition-all">
    <svg class="w-10 h-10 -rotate-90 pointer-events-none" viewBox="0 0 40 40">
      <circle cx="20" cy="20" r="18" fill="none" stroke="currentColor" stroke-width="2.5" class="text-slate-200 dark:text-slate-700" opacity="0.4"></circle>
      <circle id="back-to-top-ring" cx="20" cy="20" r="18" fill="none" stroke="#0d6efd" stroke-width="2.5" stroke-dasharray="113.1" stroke-dashoffset="113.1" stroke-linecap="round" class="transition-all duration-75"></circle>
    </svg>
    <svg class="w-4 h-4 absolute" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 15l7-7 7 7"></path></svg>
  </button>
</body>
</html>
