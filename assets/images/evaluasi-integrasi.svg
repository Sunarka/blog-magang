<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="intGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" rx="16" fill="url(#bgGrad4)"/>
  
  <!-- Decorative Grid Overlay -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="160" y1="0" x2="160" y2="450" />
    <line x1="320" y1="0" x2="320" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
    <line x1="640" y1="0" x2="640" y2="450" />
  </g>

  <!-- Integration Verification Card -->
  <g transform="translate(70, 45)">
    <rect width="660" height="360" rx="14" fill="url(#intGrad)" filter="drop-shadow(0 20px 25px rgba(0,0,0,0.25))" stroke="#e2e8f0" stroke-width="1" />
    
    <!-- Window Header -->
    <rect width="660" height="42" rx="14" fill="#f8fafc" />
    <circle cx="25" cy="21" r="5" fill="#ef4444"/>
    <circle cx="41" cy="21" r="5" fill="#f59e0b"/>
    <circle cx="57" cy="21" r="5" fill="#10b981"/>
    <text x="330" y="26" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle">Modul Integrasi & Verifikasi Alur Fungsional Sistem</text>
    <line x1="0" y1="42" x2="660" y2="42" stroke="#e2e8f0" stroke-width="1" />

    <!-- Left Box: Pagu & Renstra -->
    <g transform="translate(40, 75)">
      <rect width="160" height="180" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
      <rect width="160" height="32" rx="10" fill="#f1f5f9" />
      <text x="80" y="21" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">Modul Perencanaan</text>
      <text x="15" y="60" font-family="system-ui, sans-serif" font-size="10.5" fill="#475569">• Pos Pagu Anggaran</text>
      <text x="15" y="85" font-family="system-ui, sans-serif" font-size="10.5" fill="#475569">• Target RENSTRA</text>
      <text x="15" y="110" font-family="system-ui, sans-serif" font-size="10.5" fill="#475569">• Input Program Baru</text>
      <text x="15" y="135" font-family="system-ui, sans-serif" font-size="10.5" fill="#475569">• Alokasi Nominal</text>
      <rect x="15" y="148" width="130" height="20" rx="4" fill="#dcfce7" />
      <text x="80" y="162" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#15803d" text-anchor="middle">VERIFIED</text>
    </g>

    <!-- Center Arrow / Processing Hub -->
    <g transform="translate(225, 125)">
      <rect width="130" height="80" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5" />
      <text x="65" y="32" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#065f46" text-anchor="middle">Integrasi Data</text>
      <text x="65" y="50" font-family="system-ui, sans-serif" font-size="9.5" font-weight="500" fill="#047857" text-anchor="middle">Role Verification</text>
      <text x="65" y="66" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#10b981" text-anchor="middle">HTTP 200 OK</text>
    </g>

    <!-- Right Box: Pengajuan & Belanja -->
    <g transform="translate(380, 75)">
      <rect width="240" height="180" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
      <rect width="240" height="32" rx="10" fill="#f1f5f9" />
      <text x="120" y="21" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">Modul Belanja & Pengajuan</text>
      <text x="15" y="60" font-family="system-ui, sans-serif" font-size="10.5" fill="#475569">• Item Rincian Belanja Kampus</text>
      <text x="15" y="85" font-family="system-ui, sans-serif" font-size="10.5" fill="#475569">• Hitung Total Otomatis Sesuai Pagu</text>
      <text x="15" y="110" font-family="system-ui, sans-serif" font-size="10.5" fill="#475569">• Review Pejabat Bertingkat (Fak/Univ)</text>
      <text x="15" y="135" font-family="system-ui, sans-serif" font-size="10.5" fill="#475569">• Submit Status "Menunggu Validasi"</text>
      <rect x="15" y="148" width="210" height="20" rx="4" fill="#dcfce7" />
      <text x="120" y="162" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#15803d" text-anchor="middle">ALUR SISTEM LOLOS UJI INTEGRASI</text>
    </g>

    <!-- Bottom Notification Bar -->
    <rect x="40" y="280" width="580" height="42" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
    <text x="55" y="300" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a">Catatan Pengujian Terstruktur:</text>
    <text x="55" y="314" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Dokumentasi hasil uji fungsionalitas dan konsistensi hak akses multirole disimpan dan dilaporkan secara berkala.</text>
  </g>
</svg>

