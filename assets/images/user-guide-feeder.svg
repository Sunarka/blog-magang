<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#3730a3" />
    </linearGradient>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" rx="16" fill="url(#bgGrad2)"/>
  
  <!-- Decorative Grid Overlay -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="160" y1="0" x2="160" y2="450" />
    <line x1="320" y1="0" x2="320" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
    <line x1="640" y1="0" x2="640" y2="450" />
  </g>

  <!-- Left Side: User Guide Book Cover Representation -->
  <g transform="translate(80, 55)">
    <rect width="260" height="340" rx="12" fill="url(#bookGrad)" filter="drop-shadow(0 20px 25px rgba(0,0,0,0.3))" stroke="#e2e8f0" stroke-width="1" />
    <!-- Book Spine Accent -->
    <rect width="18" height="340" rx="12" fill="#4338ca" />
    
    <rect x="36" y="28" width="50" height="20" rx="4" fill="#ede9fe" />
    <text x="61" y="42" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#6366f1" text-anchor="middle">OFFICIAL</text>
    
    <text x="36" y="85" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#0f172a">USER GUIDE</text>
    <text x="36" y="108" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#4338ca">Sistem Feeder & Prestasi</text>
    
    <line x1="36" y1="124" x2="230" y2="124" stroke="#e2e8f0" stroke-width="1.5" />
    
    <!-- Mini steps inside guide cover -->
    <g transform="translate(36, 140)">
      <circle cx="10" cy="10" r="10" fill="#4338ca" />
      <text x="10" y="14" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
      <text x="30" y="14" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#1e293b">Sinkronisasi PDDIKTI</text>

      <circle cx="10" cy="45" r="10" fill="#4338ca" />
      <text x="10" y="49" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
      <text x="30" y="49" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#1e293b">Input SIM Prestasi</text>

      <circle cx="10" cy="80" r="10" fill="#4338ca" />
      <text x="10" y="84" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
      <text x="30" y="84" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#1e293b">Alur Sistem Konseling</text>

      <circle cx="10" cy="115" r="10" fill="#4338ca" />
      <text x="10" y="119" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
      <text x="30" y="119" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#1e293b">Penanganan Pesan Error</text>
    </g>

    <!-- Footer of Book Cover -->
    <rect x="36" y="290" width="194" height="28" rx="6" fill="#f1f5f9" />
    <text x="133" y="308" font-family="system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="middle">PT Laksita Emi Saguna • 2026</text>
  </g>

  <!-- Right Side: Flowchart & Interface Representation -->
  <g transform="translate(370, 55)">
    <rect width="350" height="340" rx="12" fill="#ffffff" filter="drop-shadow(0 20px 25px rgba(0,0,0,0.3))" stroke="#e2e8f0" stroke-width="1" />
    
    <!-- Header of UI Window -->
    <rect width="350" height="36" rx="12" fill="#f8fafc" />
    <circle cx="20" cy="18" r="5" fill="#ef4444"/>
    <circle cx="36" cy="18" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="18" r="5" fill="#10b981"/>
    <text x="175" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">Modul Sinkronisasi & Alur Data</text>
    <line x1="0" y1="36" x2="350" y2="36" stroke="#e2e8f0" stroke-width="1" />

    <!-- Diagram Boxes -->
    <rect x="25" y="55" width="300" height="60" rx="8" fill="#f8fafc" stroke="#c7d2fe" stroke-width="1.5" />
    <text x="45" y="78" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#312e81">Sistem Feeder PDDIKTI</text>
    <text x="45" y="98" font-family="system-ui, sans-serif" font-size="10.5" fill="#475569">Sinkronisasi berkala data akademik dan riwayat studi</text>

    <!-- Arrow Down -->
    <path d="M175 118 L175 142 M168 135 L175 142 L182 135" stroke="#6366f1" stroke-width="2" stroke-linecap="round" fill="none" />

    <rect x="25" y="148" width="300" height="60" rx="8" fill="#f8fafc" stroke="#c7d2fe" stroke-width="1.5" />
    <text x="45" y="171" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#312e81">Modul SIM Prestasi</text>
    <text x="45" y="191" font-family="system-ui, sans-serif" font-size="10.5" fill="#475569">Validasi berkas sertifikat & rekognisi poin prestasi</text>

    <!-- Arrow Down -->
    <path d="M175 211 L175 235 M168 228 L175 235 L182 228" stroke="#6366f1" stroke-width="2" stroke-linecap="round" fill="none" />

    <rect x="25" y="241" width="300" height="60" rx="8" fill="#f8fafc" stroke="#c7d2fe" stroke-width="1.5" />
    <text x="45" y="264" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#312e81">Sistem Konseling Kampus</text>
    <text x="45" y="284" font-family="system-ui, sans-serif" font-size="10.5" fill="#475569">Pendaftaran sesi konsultasi & penugasan konselor</text>

    <!-- Status footer -->
    <rect x="25" y="310" width="300" height="20" rx="4" fill="#ede9fe" />
    <text x="175" y="324" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#4338ca" text-anchor="middle">DOKUMENTASI TEKNIS TERVERIFIKASI</text>
  </g>
</svg>
