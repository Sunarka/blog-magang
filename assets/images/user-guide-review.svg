<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" rx="16" fill="url(#bgGrad3)"/>
  
  <!-- Decorative Grid Overlay -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="160" y1="0" x2="160" y2="450" />
    <line x1="320" y1="0" x2="320" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
    <line x1="640" y1="0" x2="640" y2="450" />
  </g>

  <!-- Review Dashboard Card -->
  <g transform="translate(70, 45)">
    <rect width="660" height="360" rx="14" fill="url(#panelGrad)" filter="drop-shadow(0 20px 25px rgba(0,0,0,0.25))" stroke="#e2e8f0" stroke-width="1" />
    
    <!-- Header -->
    <rect width="660" height="42" rx="14" fill="#f8fafc" />
    <circle cx="25" cy="21" r="5" fill="#ef4444"/>
    <circle cx="41" cy="21" r="5" fill="#f59e0b"/>
    <circle cx="57" cy="21" r="5" fill="#10b981"/>
    <text x="330" y="26" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle">Quality Review & Documentation Audit — Minggu 3</text>
    <line x1="0" y1="42" x2="660" y2="42" stroke="#e2e8f0" stroke-width="1" />

    <!-- 3 Checklist Columns -->
    <g transform="translate(30, 65)">
      <!-- Item 1 -->
      <rect width="180" height="240" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
      <rect x="15" y="15" width="30" height="30" rx="8" fill="#e0f2fe" />
      <path d="M23 30 L28 35 L38 24" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <text x="55" y="28" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Alur Konseling</text>
      <text x="55" y="42" font-family="system-ui, sans-serif" font-size="10" font-weight="500" fill="#64748b">Verified & Tested</text>
      <line x1="15" y1="58" x2="165" y2="58" stroke="#f1f5f9" stroke-width="1" />
      <text x="15" y="80" font-family="system-ui, sans-serif" font-size="10.5" fill="#475569">• Pendaftaran Sesi Mahasiswa</text>
      <text x="15" y="105" font-family="system-ui, sans-serif" font-size="10.5" fill="#475569">• Penetapan Dosen Konselor</text>
      <text x="15" y="130" font-family="system-ui, sans-serif" font-size="10.5" fill="#475569">• Jadwal Pertemuan Konseling</text>
      <text x="15" y="155" font-family="system-ui, sans-serif" font-size="10.5" fill="#475569">• Catatan Rekap Sesi Selesai</text>
      <rect x="15" y="195" width="150" height="26" rx="6" fill="#dcfce7" />
      <text x="90" y="212" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#15803d" text-anchor="middle">STATUS: REVISED (OK)</text>

      <!-- Item 2 -->
      <g transform="translate(210, 0)">
        <rect width="180" height="240" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
        <rect x="15" y="15" width="30" height="30" rx="8" fill="#e0f2fe" />
        <path d="M23 30 L28 35 L38 24" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
        <text x="55" y="28" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a">SIM Prestasi</text>
        <text x="55" y="42" font-family="system-ui, sans-serif" font-size="10" font-weight="500" fill="#64748b">Verified & Tested</text>
        <line x1="15" y1="58" x2="165" y2="58" stroke="#f1f5f9" stroke-width="1" />
        <text x="15" y="80" font-family="system-ui, sans-serif" font-size="10.5" fill="#475569">• Unggah Berkas Sertifikat</text>
        <text x="15" y="105" font-family="system-ui, sans-serif" font-size="10.5" fill="#475569">• Validasi Tingkat Prestasi</text>
        <text x="15" y="130" font-family="system-ui, sans-serif" font-size="10.5" fill="#475569">• Verifikasi Operator Prodi</text>
        <text x="15" y="155" font-family="system-ui, sans-serif" font-size="10.5" fill="#475569">• Ekspor Laporan Portofolio</text>
        <rect x="15" y="195" width="150" height="26" rx="6" fill="#dcfce7" />
        <text x="90" y="212" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#15803d" text-anchor="middle">STATUS: REVISED (OK)</text>
      </g>

      <!-- Item 3 -->
      <g transform="translate(420, 0)">
        <rect width="180" height="240" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
        <rect x="15" y="15" width="30" height="30" rx="8" fill="#e0f2fe" />
        <path d="M23 30 L28 35 L38 24" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
        <text x="55" y="28" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Feedback Mentor</text>
        <text x="55" y="42" font-family="system-ui, sans-serif" font-size="10" font-weight="500" fill="#64748b">Verified & Tested</text>
        <line x1="15" y1="58" x2="165" y2="58" stroke="#f1f5f9" stroke-width="1" />
        <text x="15" y="80" font-family="system-ui, sans-serif" font-size="10.5" fill="#475569">• Klarifikasi Batasan Role</text>
        <text x="15" y="105" font-family="system-ui, sans-serif" font-size="10.5" fill="#475569">• Perbaikan Istilah Teknis</text>
        <text x="15" y="130" font-family="system-ui, sans-serif" font-size="10.5" fill="#475569">• Penambahan Bagan Alur</text>
        <text x="15" y="155" font-family="system-ui, sans-serif" font-size="10.5" fill="#475569">• Finalisasi Berkas Uji</text>
        <rect x="15" y="195" width="150" height="26" rx="6" fill="#dcfce7" />
        <text x="90" y="212" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#15803d" text-anchor="middle">STATUS: APPROVED</text>
      </g>
    </g>

    <!-- Bottom Notification Bar -->
    <rect x="30" y="318" width="600" height="26" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1" />
    <text x="330" y="335" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#166534" text-anchor="middle">Sesi Evaluasi Bersama Mentor Lapangan PT Laksita Emi Saguna Selesai Disetujui</text>
  </g>
</svg>
